[project]
name = "rl-agents"
version = "0.1.0"
description = "RL agents in Simulations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arch>=7",
    "gym-pybullet-drones",
    "gymnasium[classic-control]>=1.3.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "joblib>=1.5.3",
    "matplotlib>=3.11.0",
    "pandas>=2,<3",
    "pyarrow>=24.0.0",
    "rliable>=1.2.0",
    "stable-baselines3[extra]>=2.9.0",
    "tqdm>=4.68.2",
    "typer>=0.26.7",
]

[tool.uv.workspace]
members = [
    "libs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.uv.sources]
gym-pybullet-drones = { workspace = true }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=9.14.1",
    "ipywidgets>=8.1.8",
    "notebook>=7.5.7",
    "pygame-ce>=2.5.7",
]
