[project]
name = "rl-agents"
version = "0.1.0"
description = "RL agents in Simulations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gym-pybullet-drones",
    "gymnasium[classic-control]>=1.3.0",
    "stable-baselines3[extra]>=2.9.0",
]

[tool.uv.workspace]
members = [
    "libs",
]

[tool.uv.sources]
gym-pybullet-drones = { workspace = true }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=9.14.1",
    "ipywidgets>=8.1.8",
    "notebook>=7.5.7",
]
